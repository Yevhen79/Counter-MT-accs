<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Tradeable Instruments — ForexClub</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 980px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.4;
    }
    h1 { margin-bottom: 0.2rem; }
    .sub { color: #666; margin-top: 0; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #ddd; padding: 0.55rem 0.8rem; text-align: right; }
    th:first-child, td:first-child { text-align: left; }
    thead th { background: #f4f4f4; }
    .delta-pos { color: #137333; }
    .delta-neg { color: #c5221f; }
    .delta-zero { color: #888; }
    .err { color: #c5221f; font-weight: bold; }
    .chart-wrap { margin-top: 1.5rem; }
    .footer { color: #999; font-size: 0.85rem; margin-top: 2rem; }
  </style>
</head>
<body>
  <h1>Tradeable instruments by account</h1>
  <p class="sub">ForexClub / Libertex — symbols with full trading enabled, refreshed daily ~13:00 Kyiv.</p>

  <h2>Latest snapshot</h2>
  <table id="latest">
    <thead>
      <tr><th>Account</th><th>Today</th><th>Yesterday</th><th>&Delta;</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>History</h2>
  <div class="chart-wrap"><canvas id="chart" height="120"></canvas></div>

  <h2>Full table</h2>
  <table id="history">
    <thead><tr></tr></thead>
    <tbody></tbody>
  </table>

  <p class="footer">
    Data: <a href="./history.csv">history.csv</a> &middot;
    Source: <a href="https://github.com/yevhen79/counter-mt-accs">github.com/yevhen79/counter-mt-accs</a>
  </p>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script>
  async function load() {
    const resp = await fetch("./history.csv?v=" + Date.now());
    const text = (await resp.text()).trim();
    const lines = text.split(/\r?\n/);
    const header = lines.shift().split(",");
    const rows = lines.filter(l => l.length).map(l => {
      const parts = l.split(",");
      const o = {};
      header.forEach((h, i) => o[h] = parts[i]);
      return o;
    });

    const accounts = header.slice(1);

    // Latest snapshot table (today + yesterday + delta).
    const latestBody = document.querySelector("#latest tbody");
    const today = rows[rows.length - 1];
    const yest  = rows[rows.length - 2];
    if (!today) {
      latestBody.innerHTML = `<tr><td colspan="4">No data yet. Wait for the first workflow run.</td></tr>`;
    } else {
      for (const a of accounts) {
        const tv = today[a];
        const yv = yest ? yest[a] : "";
        const isNumT = tv && tv !== "ERR" && !isNaN(+tv);
        const isNumY = yv && yv !== "ERR" && !isNaN(+yv);
        let delta = "—";
        let deltaCls = "delta-zero";
        if (isNumT && isNumY) {
          const d = +tv - +yv;
          delta = (d > 0 ? "+" : "") + d;
          deltaCls = d > 0 ? "delta-pos" : (d < 0 ? "delta-neg" : "delta-zero");
        }
        latestBody.insertAdjacentHTML("beforeend", `
          <tr>
            <td>${a}</td>
            <td class="${isNumT ? "" : "err"}">${tv ?? "—"}</td>
            <td class="${isNumY ? "" : (yv === "ERR" ? "err" : "")}">${yv ?? "—"}</td>
            <td class="${deltaCls}">${delta}</td>
          </tr>`);
      }
    }

    // Full history table.
    const histHead = document.querySelector("#history thead tr");
    histHead.innerHTML = header.map(h => `<th>${h}</th>`).join("");
    const histBody = document.querySelector("#history tbody");
    for (let i = rows.length - 1; i >= 0; i--) {
      const r = rows[i];
      histBody.insertAdjacentHTML("beforeend",
        "<tr>" + header.map(h => {
          const v = r[h];
          const cls = (h !== "date" && v === "ERR") ? "err" : "";
          return `<td class="${cls}">${v ?? ""}</td>`;
        }).join("") + "</tr>");
    }

    // Chart.
    if (rows.length) {
      const labels = rows.map(r => r.date);
      const datasets = accounts.map(a => ({
        label: a,
        data: rows.map(r => {
          const v = r[a];
          return (v === "ERR" || v === undefined || v === "") ? null : +v;
        }),
        spanGaps: true,
        tension: 0.2
      }));
      new Chart(document.getElementById("chart"), {
        type: "line",
        data: { labels, datasets },
        options: {
          responsive: true,
          interaction: { mode: "index", intersect: false },
          scales: { y: { beginAtZero: false } }
        }
      });
    }
  }
  load().catch(e => {
    document.body.insertAdjacentHTML("beforeend",
      `<pre style="color:red">${e.message}</pre>`);
  });
  </script>
</body>
</html>
