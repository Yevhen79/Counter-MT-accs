# URL of the broker's MT4 installer.
# Can be either a direct .exe URL or the broker's download page — the install
# script auto-detects (it looks at the response: PE binary => save as installer,
# HTML => scrape the first .exe link from the page and follow it).
mt4_installer_url: "https://libertex.org/platforms/metatrader4#download-link?icid=download_mt4"
