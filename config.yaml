# Accounts to count, across two brokers (ForexClub and Libertex Cyprus),
# each on MetaTrader 4 and 5.
#
# Each account references the broker-branded terminal it must run on (the
# symbol catalog the server returns depends on the branded terminal, so a
# ForexClub account must use the ForexClub terminal and a Libertex account
# the Libertex one). The installer is downloaded and installed once per
# unique installer_url; dir_hint is the substring of the install folder
# used to locate the terminal afterwards.
#
# Server names and login numbers are NOT secret. Passwords MUST be added
# to GitHub Secrets with the names in password_secret.

# ============================================================================
#  КАК РЕДАКТИРОВАТЬ (самостоятельно, без программиста)
# ============================================================================
#  Это список счетов, которые считает робот. Можно менять прямо в GitHub:
#  открой этот файл → карандаш (Edit) → поправь → Commit changes
#  (в ветку claude/trading-tools-report-MCrOV). Сохранение само запустит
#  новый прогон, и через ~15-20 мин данные обновятся на дашборде.
#
#  Что где менять у счёта:
#    login   — номер счёта (число, БЕЗ кавычек)
#    server  — имя сервера брокера (в кавычках, как в терминале)
#    label   — название колонки в отчёте (в кавычках, должно быть уникальным)
#    password_secret — ИМЯ секрета, где лежит ПАРОЛЬ. Сам пароль здесь НЕ
#                      хранится (репозиторий публичный). Пароль меняется в
#                      Settings → Secrets and variables → Actions → открыть
#                      этот секрет → Update.
#    installer_url — ссылка на установщик терминала этого брокера
#    dir_hint — кусок имени папки установки (ForexClub / Libertex)
#
#  ПОМЕНЯТЬ СЧЁТ (например, кипрский MT5 ушёл в close-only):
#    1) здесь поправь login (и server, если другой) у нужного счёта
#    2) в Secrets обнови значение его password_secret на новый пароль
#    3) Commit — прогон запустится сам
#
#  ДОБАВИТЬ СЧЁТ: скопируй блок "- key: ..." целиком, дай новый уникальный
#    key и label, заполни login/server/password_secret/installer_url/dir_hint,
#    и заведи новый секрет с этим именем password_secret.
#  УДАЛИТЬ СЧЁТ: удали его блок "- key: ... " целиком.
#
#  Перед запуском конфиг проверяется автоматически: при опечатке (сломанные
#  отступы, пропущенное поле, нечисловой login, повтор label) прогон упадёт
#  на шаге "Validate config" с понятным описанием, что поправить.
# ============================================================================

accounts:
