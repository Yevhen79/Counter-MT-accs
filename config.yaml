# Server names and login numbers are NOT secret — they live in this file.
# Passwords MUST be added to GitHub Secrets with the names listed below.
#
# How to add a secret:
#   Repo Settings -> Secrets and variables -> Actions -> New repository secret
#   Use the exact value from "password_secret" as the secret name.

