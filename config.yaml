# Accounts to count, across two brokers (ForexClub and Libertex Cyprus),
# each on MetaTrader 4 and 5.
#
# Each account references the broker-branded terminal it must run on (the
# symbol catalog the server returns depends on the branded terminal, so a
# ForexClub account must use the ForexClub terminal and a Libertex account
# the Libertex one). The installer is downloaded and installed once per
# unique installer_url; dir_hint is the substring of the install folder
# used to locate the terminal afterwards.
#
# Server names and login numbers are NOT secret. Passwords MUST be added
# to GitHub Secrets with the names in password_secret.

accounts:
  # --- ForexClub ---
  - key: mt4_market
    label: "MT4 Market"
    platform: mt4
    login: 730232800
    server: "ForexClub-MT4 Market Real 2 Server"
    password_secret: MT4_MARKET_PASSWORD
    installer_url: "https://download.fxclub.org/Metatrader/fcmt4setup_ru.exe"
    dir_hint: "ForexClub"

  - key: mt4_instant
    label: "MT4 Instant"
    platform: mt4
    login: 710268540
    server: "ForexClub-MT4 Real 2 Server"
    password_secret: MT4_INSTANT_PASSWORD
    installer_url: "https://download.fxclub.org/Metatrader/fcmt4setup_ru.exe"
    dir_hint: "ForexClub"

  - key: mt5_market
    label: "MT5 Market"
    platform: mt5
    login: 550459323
    server: "ForexClub-MT5 Real Server"
    password_secret: MT5_MARKET_PASSWORD
    installer_url: "https://download.libertex.org/metatrader/fcmt5setup.exe"
    dir_hint: "ForexClub"

  - key: mt5_instant
    label: "MT5 Instant"
    platform: mt5
    login: 555105689
    server: "ForexClub-MT5 Instant Real Server"
    password_secret: MT5_INSTANT_PASSWORD
    installer_url: "https://download.libertex.org/metatrader/fcmt5setup.exe"
    dir_hint: "ForexClub"

  # --- Libertex (Cyprus) ---
  - key: lib_mt4_market
    label: "Libertex MT4 Market"
    platform: mt4
    login: 950131906
    server: "LibertexCom-MT4 Market Real Server"
    password_secret: LIBERTEX_MT4_MARKET_PASSWORD
    installer_url: "https://download.libertex.com/software/metatrader/libertexcom4setup.exe"
    dir_hint: "Libertex"

  - key: lib_mt5_market
    label: "Libertex MT5 Market"
