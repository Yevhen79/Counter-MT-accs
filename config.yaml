# URL of the broker's MT4 installer. Direct .exe URL is preferred — the
# script auto-detects, but a direct binary URL avoids the HTML scrape step.
# Tried URLs (broker-branded NSIS installers, all use the same engine):
#   https://download.libertex.org/en/Meta/fcmt4setup_eng.exe   # English
#   https://download.fxclub.org/Metatrader/fcmt4setup_ru.exe   # Russian
# All known versions ignore /S /VERYSILENT /silent /quiet /auto and pop a
# GUI, so the install script eventually falls back to MetaQuotes' generic
# MT4 (which honors /auto). The broker server name still resolves via
# MetaQuotes' global server registry.
mt4_installer_url: "https://download.fxclub.org/Metatrader/fcmt4setup_ru.exe"
